#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "filebrowser-quantum"
name = "FileBrowser Quantum"
description.en = "Web File Browser"
description.fr = "Navigateur de fichiers Web"

version = "2.0.5~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
admindoc = "https://filebrowserquantum.com/en/docs/getting-started/linux/"
code = "https://github.com/gtsteffaniak/filebrowser"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "100M"
ram.build = "100M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    type = "password"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    rename = "filebrowser"
    extract = false
    amd64.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v2.0.5-beta/linux-amd64-filebrowser"
    amd64.sha256 = "acc53b79f50c0e83dc78773b76dd79f65fba75492c01f62d17087286e78a8093"
    arm64.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v2.0.5-beta/linux-arm64-filebrowser"
    arm64.sha256 = "28ae5359e74ae12cedad101555ba809c9c8dfde52b0fbc7681e041cf1d1b77d8"
    armhf.url = "https://github.com/gtsteffaniak/filebrowser/releases/download/v2.0.5-beta/linux-armv7-filebrowser"
    armhf.sha256 = "sha256:0a6b5ea1e26cbb427fae0097f7b8ef5f6c2c0d4bc931428da6b1ecdc180a5362"
    autoupdate.strategy = "latest_github_release"
    autoupdate.version_regex = "v(\\d+\\.\\d+\\.\\d+)-stable"
    autoupdate.asset.amd64 = "linux-amd64-filebrowser"
    autoupdate.asset.arm64 = "linux-arm64-filebrowser"
    autoupdate.asset.armhf = "linux-armv7-filebrowser"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "ffmpeg"
